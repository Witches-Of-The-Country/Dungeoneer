name: Backend CI (player-character-service)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'player-character-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'player-character-service/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout player-character-service submodule
        run: git submodule update --init --depth 1 player-character-service

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: player-character-service/backend/pom.xml

      - name: Run tests
        working-directory: ./player-character-service/backend
        run: mvn clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: player-character-service/backend/target/site/jacoco/
          retention-days: 14
