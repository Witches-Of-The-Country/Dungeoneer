name: Frontend CI (dungeoneer-frontend)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'dungeoneer-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'dungeoneer-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout dungeoneer-frontend submodule
        run: git submodule update --init --depth 1 dungeoneer-frontend

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dungeoneer-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./dungeoneer-frontend
        run: npm ci

      - name: Run linter
        working-directory: ./dungeoneer-frontend
        run: npm run lint || true

      - name: Run tests
        working-directory: ./dungeoneer-frontend
        run: npm test

      - name: Build
        working-directory: ./dungeoneer-frontend
        run: npm run build
