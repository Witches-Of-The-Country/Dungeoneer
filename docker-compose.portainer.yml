version: "3.8"

networks:
  dungeoneer-net:
    driver: bridge

volumes:
  dungeoneer-db-data:

services:
  db:
    image: postgres:15-alpine
    container_name: dungeoneer-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dungeoneer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dungeoneer-db-data:/var/lib/postgresql/data
    networks:
      - dungeoneer-net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dungeoneer"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: ghcr.io/witches-of-the-country/auth-service:latest
    container_name: dungeoneer-auth
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dungeoneer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_GATEWAY_SECRET: "${INTERNAL_GATEWAY_SECRET:-}"
      PORT: 8080
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - dungeoneer-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  player-character-service:
    image: ghcr.io/witches-of-the-country/player-character-service:latest
    container_name: dungeoneer-character
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dungeoneer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      INTERNAL_GATEWAY_SECRET: "${INTERNAL_GATEWAY_SECRET:-}"
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - dungeoneer-net
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  api-gateway:
    image: ghcr.io/witches-of-the-country/api-gateway:latest
    container_name: dungeoneer-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      CHARACTER_SERVICE_URL: http://player-character-service:8080
      PLAYER_CHARACTER_SERVICE_URL: http://player-character-service:8080
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_GATEWAY_SECRET: "${INTERNAL_GATEWAY_SECRET:-}"
      PORT: 8080
      CORS_ALLOWED_ORIGINS: "${FRONTEND_URL:-http://localhost:3000}"
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    networks:
      - dungeoneer-net
    depends_on:
      - player-character-service
      - auth-service
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  dungeoneer-frontend:
    image: ghcr.io/witches-of-the-country/dungeoneer-frontend:latest
    container_name: dungeoneer-frontend
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: "http://api-gateway:8080"
    ports:
      # Porta 8080: porta padrão HTTP compatível com o proxy da Cloudflare
      - "8080:3000"
    networks:
      - dungeoneer-net
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
