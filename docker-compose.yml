services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dungeoneer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - dungeoneer-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dungeoneer"]
      interval: 10s
      timeout: 5s
      retries: 5

  player-character-service:
    build:
      context: ./player-character-service/backend
      dockerfile: ../Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dungeoneer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      - "8080:8080"
    networks:
      - dungeoneer-net
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway/backend
      dockerfile: ../Dockerfile
    environment:
      PLAYER_CHARACTER_SERVICE_URL: http://player-character-service:8080
      # CAMPAIGN_SERVICE_URL: http://campaign-service:8081
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "9090:8080"
    networks:
      - dungeoneer-net
    depends_on:
      - player-character-service

  dungeoneer-frontend:
    build:
      context: ./dungeoneer-frontend
    environment:
      # Until api-gateway is implemented, point directly to player-character-service
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - dungeoneer-net
    depends_on:
      - player-character-service

  auth-service:
    build:
      context: ./auth-service/backend
      dockerfile: ../Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dungeoneer
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JWT_SECRET: ${JWT_SECRET:-dungeoneer_default_development_secret_key_minimum_256_bits_length!}
      PORT: 8080
    ports:
      - "8082:8080"
    networks:
      - dungeoneer-net
    depends_on:
      db:
        condition: service_healthy

  # campaign-service:
  #   build:
  #     context: ./campaign-service/backend
  #     dockerfile: ../Dockerfile
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dungeoneer
